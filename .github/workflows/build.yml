name: build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Generate Android.bp
      run: |
        ./gradlew app:generateBp
        if [[ ! -z $(git status -s) ]]; then
          git status
          exit 1
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Build Release APK
      if: startsWith(github.ref, 'refs/tags/')
      run: ./gradlew assembleRelease --stacktrace

    - name: Find APK files
      id: find_apk
      run: |
        if [[ ${{ github.ref }} == refs/tags/* ]]; then
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_NAME="Catapult-release-${{ github.ref_name }}.apk"
        else
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          APK_NAME="Catapult-debug-$(echo ${{ github.sha }} | cut -c1-7).apk"
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"
        echo "Will be named: $APK_NAME"

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.find_apk.outputs.apk_name }}
        path: ${{ steps.find_apk.outputs.apk_path }}

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
        release_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0} ({1})', github.run_number, github.sha) }}
        body: |
          Automated release from commit ${{ github.sha }}
          
          **Changes:** ${{ github.event.head_commit.message }}
          
          Built from: ${{ github.ref }}
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: Upload APK to Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.find_apk.outputs.apk_path }}
        asset_name: ${{ steps.find_apk.outputs.apk_name }}
        asset_content_type: application/vnd.android.package-archive
